name: project-review

# The weekly read of the org: what has gone stale, what is over WIP, what to do
# next. Replaces the wiki-staleness wall of text that used to land in #dev.
#
# Lives HERE rather than in discobots, the usual home for Discord bots, because
# this is the only repo holding PROJECT_SYNC_TOKEN — a PAT with `project` scope,
# which the default GITHUB_TOKEN does not have and cannot be granted. Copying that
# PAT to the org so the job could live elsewhere would widen a credential's blast
# radius to every repo, to save moving one file. The policy file is here too.

on:
  schedule:
    # Mondays 08:00 UTC — before the week's work is chosen, not after.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write Priority to the boards (unchecked = report only)"
        type: boolean
        default: false
      post:
        description: "Post to #dev"
        type: boolean
        default: true
      brief:
        description: "Open/refresh the weekly ops-brief issue"
        type: boolean
        default: true

concurrency:
  group: project-review
  cancel-in-progress: false

permissions:
  contents: read
  # The ops brief is an issue in THIS repo, written with the run's own token —
  # not with PROJECT_SYNC_TOKEN, whose blast radius stays read/project-only.
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # `curl | bash` reports success whenever CURL succeeds — the installer can
      # fail inside the pipe and still exit 0. On 2026-08-08 that left no binary and
      # the job died much later, inside the ranking call, as a bare FileNotFoundError.
      # Verify here so a bad install fails where it happened.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          command -v claude >/dev/null || { echo "installer exited 0 but left no claude binary"; exit 1; }
          claude --version

      - name: Review
        env:
          # `project` scope. GITHUB_TOKEN cannot read or write org Projects v2 at
          # all, so without this the job sees no boards.
          GH_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          BRIEF_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # NOTHING WRITES ON A SCHEDULE — report-only until the ranking has been
          # read against a real board. Priority had never existed on #7 (353 items)
          # before 2026-08-08, so the first scheduled run would have been both the
          # debut of the field and the debut of the ranking that fills it, unread.
          #
          # To turn writes on once Monday's list looks right: add
          # `[ "${{ github.event_name }}" = "schedule" ] ||` to the test below. The
          # fences stay either way — 25 items per run, and a priority a human set is
          # never overwritten.
          APPLY=""
          if [ "${{ inputs.apply }}" = "true" ]; then
            APPLY="--apply"
          fi
          POST=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.post }}" = "true" ]; then
            POST="--post"
          fi
          # The brief is the inversion of control: the report goes to #dev, the
          # DECISIONS go to one `human-task` issue here, each with a default that
          # applies if unanswered. A quiet week opens nothing.
          BRIEF=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.brief }}" = "true" ]; then
            BRIEF="--brief"
          fi
          uv run --with pyyaml python ops/project_review.py $APPLY $POST $BRIEF

      - name: Unit tests
        run: uv run --with pyyaml --with pytest pytest ops/tests -q
